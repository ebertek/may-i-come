# Add this entry to automations.yaml (or create it in the UI using YAML mode).
# The manual choice only permits visitors when guest_mode is explicitly OFF.
# Any guest-mode ON/unknown/unavailable state fails closed to NO.
# Publish on either helper changing, HA startup, and every minute.
- id: may_i_come_publish_status
  alias: "May I Come? — Publish visitor status"
  description: "Publish visitor permission, rejecting new guests while guest Wi-Fi is occupied."
  triggers:
    - trigger: state
      entity_id:
        - input_select.may_i_come
        - input_boolean.guest_mode
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: "/1"
  actions:
    - action: rest_command.may_i_come_publish
      data:
        status: >-
          {{ states('input_select.may_i_come')
             if is_state('input_boolean.guest_mode', 'off')
             and states('input_select.may_i_come') in ['Absolutely not', 'Ask first', 'Visitors welcome']
             else 'Absolutely not' }}
  mode: restart
